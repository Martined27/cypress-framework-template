name: Cypress E2E Suite (Parallel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep_tags:
        description: 'Optional @cypress/grep tag filter (e.g., @smoke or @regression)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint specs, Page Objects, and helpers
        run: npm run lint

      - name: Verify live Practice Software Testing target reachability
        run: |
          for i in {1..15}; do
            if curl -sf https://practicesoftwaretesting.com >/dev/null; then
              echo "Practice Software Testing live service ready"
              break
            fi
            sleep 2
          done

      - name: Run Cypress Suite (Weight-Balanced Parallel)
        run: |
          if [ -n "${{ inputs.grep_tags }}" ]; then
            npx cypress run --browser chrome --env grepTags="${{ inputs.grep_tags }}"
          else
            npm run cy:parallel:chrome
          fi

      - name: Upload Mochawesome HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-test-report
          path: cypress/reports/
          retention-days: 14
