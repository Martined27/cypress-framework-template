services:
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    ports:
      - "3306:3306"
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:latest
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=true
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - mariadb

  web:
    image: nginx:1.23.3-alpine
    ports:
      - "8091:80"
    volumes:
      - laravel-app-code:/var/www
      - ./_docker/vhost.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel-api

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:latest
    ports:
      - "4200:4200"
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"
    depends_on:
      - web

volumes:
  laravel-app-code:
